<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#0F292A" />
      <stop offset="55%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#05080F" />
    </radialGradient>
    <linearGradient id="brandGrad" x1="160" y1="620" x2="640" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="55%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="200" y1="120" x2="600" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="180" fill="url(#bgGlow)" />

  <!-- Subtle outer ring for circular Twitter crop framing -->
  <circle cx="400" cy="400" r="340" stroke="url(#shieldBorder)" stroke-width="3" stroke-opacity="0.28" />
  <circle cx="400" cy="400" r="300" stroke="#1E293B" stroke-width="2" stroke-dasharray="10 10" />

  <!-- Hexagonal On-Chain Shield -->
  <path
    d="M400 130 L620 255 L620 505 L400 630 L180 505 L180 255 Z"
    fill="#0B1320"
    fill-opacity="0.85"
    stroke="url(#shieldBorder)"
    stroke-width="8"
    stroke-linejoin="round"
  />

  <!-- Ascending 4-Milestone Path -->
  <path
    d="M250 475 L340 385 L430 425 L545 275"
    stroke="url(#brandGrad)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Milestone Node 1 (Completed) -->
  <circle cx="250" cy="475" r="24" fill="#10B981" stroke="#090D16" stroke-width="8" />
  <!-- Milestone Node 2 (Completed) -->
  <circle cx="340" cy="385" r="24" fill="#10B981" stroke="#090D16" stroke-width="8" />
  <!-- Milestone Node 3 (Completed) -->
  <circle cx="430" cy="425" r="24" fill="#14B8A6" stroke="#090D16" stroke-width="8" />
  <!-- Milestone Node 4 (Final Launch Node with Checkmark) -->
  <circle cx="545" cy="275" r="46" fill="url(#brandGrad)" stroke="#090D16" stroke-width="10" />
  <path
    d="M525 275 L539 289 L567 261"
    stroke="#05080F"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Bottom Verification Badge Bar -->
  <rect x="295" y="510" width="210" height="44" rx="22" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="3" />
  <path d="M335 532 L345 542 L365 522" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="382" y="527" width="90" height="10" rx="5" fill="#34D399" />
</svg>
